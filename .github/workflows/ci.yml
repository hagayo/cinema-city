name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Tests and coverage
        run: uv run pytest

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: pylint
        run: uv run pylint --fail-under=9.0 src tests

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run Bandit (Security scan)
        run: uvx bandit -ll -r . -x tests,venv,.venv
        # run: uv run bandit -c pyproject.toml -r .

      # - name: Run OSV-Scanner (Vulnerability scan)
        # run: uv run --with osv-scanner osv-scanner --lockfile=uv.lock

  gitleaks:
    permissions:
      contents: read
    runs-on:
      ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: 
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          args: detect --redact --verbose
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    # uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d940608fa8bfedca7e2c9085ec30e4635678cb58 # v2.5.0

  trufflehog:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0    # checks all commits history

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before }}
          # base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified    # fail only on verified secrets

  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build wheel and source archive
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinema-city-dist
          path: dist/

  git-sizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install git-sizer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/git-sizer-bin"
          GOBIN="$RUNNER_TEMP/git-sizer-bin" \
            go install github.com/github/git-sizer@v1.5.0
          echo "$RUNNER_TEMP/git-sizer-bin" >> "$GITHUB_PATH"

      - name: Check repository size
        run: git-sizer --verbose
